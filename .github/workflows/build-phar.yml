name: Build shsuggest.phar

on:
  push:
    branches:
      - main
    tags:
      - '*'
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: phar
          tools: composer

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --classmap-authoritative --no-interaction --no-progress

      - name: Build PHAR
        run: php -d phar.readonly=0 build-phar.php

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shsuggest.phar
          path: shsuggest.phar

      - name: Attach binary to release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: shsuggest.phar
